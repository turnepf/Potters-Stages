# XcodeGen spec. Regenerate the Xcode project with:  xcodegen generate
name: PottersStages

options:
  bundleIdPrefix: net.patrickturner
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: NQ6AJVVBBJ
    CODE_SIGN_STYLE: Automatic
    REGISTER_APP_GROUPS: YES
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  PottersStages:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
      - Shared
    dependencies:
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.patrickturner.pottersstages
        PRODUCT_NAME: PottersStages
        INFOPLIST_FILE: Config/App-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Potter's Stages"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of a piece."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/App-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/App-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  ShareExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.patrickturner.pottersstages.ShareExtension
        PRODUCT_NAME: ShareExtension
        INFOPLIST_FILE: Config/Share-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Potter's Stages"
        CODE_SIGN_ENTITLEMENTS: Config/Share-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Share-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  PottersStagesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PottersStages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.patrickturner.pottersstages.tests
        GENERATE_INFOPLIST_FILE: YES

  PottersStagesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PottersStages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.patrickturner.pottersstages.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PottersStages
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  PottersStages:
    build:
      targets:
        PottersStages: all
    test:
      targets: [PottersStagesTests, PottersStagesUITests]
